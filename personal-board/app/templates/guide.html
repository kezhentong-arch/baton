<!doctype html>
<html lang="{{HTML_LANG}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{t:guide.title}} · {{t:app.name}}</title>
<link rel="stylesheet" href="/static/app.css">
<script>try{var t=localStorage.getItem("mb.theme");if(t&&t!=="auto")document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>.wrap{max-width:860px;margin:0 auto;padding:18px 18px 60px}.card{margin-top:14px}.card h3{font-size:16px}ol,ul{padding-left:22px}li{margin:4px 0}code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--bg);padding:1px 5px;border-radius:4px}pre{background:var(--bg);padding:10px 12px;border-radius:8px;overflow:auto;font-size:12.5px}</style></head>
<body>
<header class="top"><div class="top-l"><a class="brand" href="{{BASE}}/">← {{t:app.name}}</a></div><div class="top-m">{{t:guide.subtitle}}</div><div class="top-r"></div></header>
<div class="wrap">
  <div class="card"><h3>{{t:guide.what.h}}</h3>{{t:guide.what.body}}</div>
  <div class="card"><h3>{{t:guide.start.h}}</h3>{{t:guide.start.body}}</div>
  <div class="card"><h3>{{t:guide.ai.h}}</h3>{{t:guide.ai.body}}</div>
  <div class="card"><h3>{{t:guide.daily.h}}</h3>{{t:guide.daily.body}}</div>
  <div class="card"><h3>{{t:guide.team.h}}</h3>{{t:guide.team.body}}</div>
</div>
</body></html>
